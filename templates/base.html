{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

     
        <link href="https://getbootstrap.com/docs/4.0/dist/css/bootstrap.min.css" rel="stylesheet" />

        <!-- Font Awesome Icons -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

        <link type='text/css' href="{% static 'css/blog.css' %}" rel="stylesheet" />
        
            <title>{% block title %}Django Blogs{% endblock title %}</title>
        

    </head>
    <body>
        <div class="container">
            <header class="blog-header py-3">
                <div class="row flex-nowrap justify-content-between align-items-center">
                    <div class="col-8 pt-1">
                        <a class="blog-header-logo text-dark" href="/">Django Blog</a>
                    </div>
                    <div class="col-4 d-flex justify-content-end align-items-center">
                        <a class="btn btn-sm btn-warning" href="#">Login</a> &nbsp;
                        <a class="btn btn-sm btn-outline-secondary" href="#">Register</a>
                    </div>
                </div>
            </header>

            <!--  Categories --> 
            <div class="nav-scroller py-1 mb-2">
                <nav class="nav d-flex justify-content-between">
                    {% for category in categories %}
                        <a class="p-2 text-muted" href="{%url 'posts_by_category' category.id%}">{{category}}</a>
                    {% endfor %}
                </nav>
            </div>


        {% block content %}
            
            
        {% endblock content %}
        
        <footer class="blog-footer">
            <p>Django blog built with � by <a href="#">Rathan Kumar</a></p>
        </footer>
    </body>
</html>
