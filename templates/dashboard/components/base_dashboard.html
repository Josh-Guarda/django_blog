{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>
    <!-- Favicon -->
    <link rel="shortcut icon" href="{% static 'svg/logo.svg'%}" type="image/x-icon">
    <!-- Custom styles -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
    <div class="layer"></div>
    <!-- ! Body -->
    <a class="skip-link sr-only" href="#skip-target">Skip to content</a>
    <div class="page-flex">
    <!-- Load SideBar -->
    {% include "dashboard/components/sidebar.html" %}
        <div class="main-wrapper">
            <!-- ! Load Main nav Header -->
            {%include 'dashboard/components/dashboard_header.html'%}


            <!-- ! Main -->
            <main class="main users chart-page" id="skip-target">
            <div class="container">
                
                {% block content %}
                    
                {% endblock content %}
                
            </div>
            </main>

            <!-- ! Load Footer -->
            {%include 'dashboard/components/dashboard_footer.html' %}
        </div>

    </div>
<!-- Chart library -->
<script src="{%static 'plugins/chart.min.js'%}"></script>
<!-- Icons library -->
<script src="{%static 'plugins/feather.min.js'%}"></script>
<!-- Custom scripts -->
<script src="{%static 'js/script.js'%}"></script>
</body>

</html>
