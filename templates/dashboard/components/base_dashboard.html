{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Dashboard</title>
    
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
    
    <!-- Favicon -->
    <link rel="shortcut icon" href="{% static 'svg/Logo.svg'%}" type="image/x-icon">
    <!-- Custom styles -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
    <div class="layer"></div>
    <!-- ! Body -->
    
    <div class="page-flex">
    <!-- Load SideBar -->
    {% include "dashboard/components/sidebar.html" %}
        <div class="main-wrapper">
            <!-- ! Load Main nav Header -->
            {%include 'dashboard/components/dashboard_header.html'%}

            <!-- ! Main -->
            <main class="main users chart-page" id="skip-target">
            <div class="container">
                
                {% block content %}
                    
                {% endblock content %}
                
            </div>
            </main>

            <!-- ! Load Footer -->
            {%include 'dashboard/components/dashboard_footer.html' %}
        </div>

        
        
        <!--TOAST Message Container-->
        <div id="dashboardToastMessage" class="toast">
            <div class="toast-content">
                <div class="toast-body" id="toastBody">
                    <!-- Message Goes Here -->
                </div>
                <button class="toast-close" aria-label="Close">&times;</button>
            </div>
        </div>
    </div>



    <!-- Chart library -->
    <script src="{%static 'plugins/chart.min.js'%}"></script>
    <!-- Icons library -->
    <script src="{%static 'plugins/feather.min.js'%}"></script>
    <!-- SweetAlert2 library -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Custom scripts -->
    
    <!-- NOTE: TO BE ABLE TO PASS THE csrf_token easier to manually created form via js function you need to include the script below  
     
    <script>window.CSRF_TOKEN = "{{ csrf_token }}";</script> 
    #ONCE loaded inside your form use an input type=hidden tag then load this as value 

    eg. 
    var TOKEN_VALUE = window.CSRF_TOKEN
    <input type="hidden" name="csrfmiddlewaretoken" value=${TOKEN_VALUE}>
    -->
    <script>window.CSRF_TOKEN = "{{ csrf_token }}";</script>
    <script src="{%static 'js/script.js'%}"></script>
</body>

</html>
