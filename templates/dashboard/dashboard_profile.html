{% extends "dashboard/components/base_dashboard.html" %}

{% block content %}
<h3 class="main-title">{{current_user.first_name}} {{current_user.last_name}} </h3>


<div class="container">

    <!-- LEFT COLUMN -->
    <div class="left-column">
        <div class="card">
            <div class="card-header">Profile Picture</div>
            <div class="card-body center">
                
                <img class="profile-img" 
                     src="http://bootdey.com/img/Content/avatar/avatar1.png" 
                     alt="Profile Image">

                <div class="help-text">
                    JPG or PNG no larger than 5 MB
                </div>

                <button class="btn-primary" type="button">
                    Upload new image
                </button>
            </div>
        </div>
    </div>

    <!-- RIGHT COLUMN -->
    <div class="right-column">

        <div class="card">
            <div class="card-header">Account Details</div>
            <div class="card-body">
                <form>
                    
                    <!-- First & Last Name -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="inputFirstName">First name</label>
                            <input type="text" id="inputFirstName" placeholder="Enter your first name" value="{{current_user.first_name}}">
                        </div>

                        <div class="form-group">
                            <label for="inputLastName">Last name</label>
                            <input type="text" id="inputLastName" placeholder="Enter your last name" value="{{current_user.last_name}}">
                        </div>
                    </div>

                    {% comment %} <!-- Organization & Location -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="inputOrgName">Organization name</label>
                            <input type="text" id="inputOrgName" placeholder="Enter your organization name" value="Start Bootstrap">
                        </div>

                        <div class="form-group">
                            <label for="inputLocation">Location</label>
                            <input type="text" id="inputLocation" placeholder="Enter your location" value="San Francisco, CA">
                        </div>
                    </div> {% endcomment %}

                    <!-- Email -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="inputEmailAddress">Email address</label>
                            <input type="email" id="inputEmailAddress" placeholder="Enter your email address" value="name@example.com">
                        </div>
                        <div class="form-group">
                            <label for="inputPhone">Phone number</label>
                            <input type="tel" id="inputPhone" placeholder="Enter your phone number" value="555-123-4567">
                        </div>
                    </div>
                    <!-- Phone & Birthday -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="inputDateJoined">Date Joined</label>
                            <input type="tel" id="inputDateJoined" disabled value="{{current_user.date_joined|date:"jS F Y"}}">
                        </div>

                        <div class="form-group">
                            <label for="inputAccessType">Access Type</label>
                            <input type="text" id="inputAccessType"  value="{{current_user.group}}">
                        </div>
                    </div>

                    <button class="btn-primary" type="button">
                        Save changes
                    </button>

                </form>
            </div>
        </div>
    </div>

</div>
























{% endblock content %}
