{% extends "dashboard/components/base_dashboard.html" %}

{% block content %}

<div class="container">
    <!-- LEFT COLUMN -->
    <div class="left-column">
        <div class="card">
            <div class="card-header">Profile Picture</div>
            <div class="card-body center">

                <form action="" method="POST" id="profileUpdate" enctype="multipart/form-data">
                    {% csrf_token %}
                    <img class="profile-img" id ="display-image"
                        src="{{ current_user.bloguser.avatar.url }}"
                        alt="{{current_user.first_name}}">

                    <div class="help-text">
                        JPG or PNG no larger than 5 MB
                    </div>

                    <div class="upload-sec">
                        <label for="avatar-upload" class="upload-label">Upload avatar</label>
                        <input class="btn" type="file" id="avatar-upload" name="avatar" accept="image/png,image/jpeg"/>
                    </div>
                
            </div>
        </div>
    </div>

    <!-- RIGHT COLUMN -->
    <div class="right-column">
        <div class="card">
            <div class="card-header">Account Details</div>
            <div class="card-body">
                
                    <!-- First & Last Name -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="inputFirstName">First name</label>
                            <input type="text" id="inputFirstName" placeholder="Enter your first name" value="{{current_user.first_name}}" name="first_name">
                        </div>

                        <div class="form-group">
                            <label for="inputLastName">Last name</label>
                            <input type="text" id="inputLastName" placeholder="Enter your last name" value="{{current_user.last_name}}" name="last_name">
                        </div>
                    </div>

                    {% comment %} <!-- Organization & Location -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="inputOrgName">Organization name</label>
                            <input type="text" id="inputOrgName" placeholder="Enter your organization name" value="Start Bootstrap">
                        </div>

                        <div class="form-group">
                            <label for="inputLocation">Location</label>
                            <input type="text" id="inputLocation" placeholder="Enter your location" value="San Francisco, CA">
                        </div>
                    </div> {% endcomment %}

                    <!-- Email -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="inputEmailAddress">Email address</label>
                            <input type="email" id="inputEmailAddress" placeholder="Enter your email address" value="{{current_user.email}}" name="email">
                        </div>
                        <div class="form-group">
                            <label for="inputPhone">Phone number</label>
                            <input type="tel" id="inputPhone" placeholder="Enter your phone number" value="{{current_user.bloguser.mobile}}" name="mobile">
                        </div>
                    </div>
                    <!-- Joined Date-->
                    <div class="form-row">
                        <div class="form-group col-6">
                            <label for="inputDateJoined">Date Joined</label>
                            {% comment %} <input type="text" id="inputDateJoined" value="{{current_user.date_joined}}" name="date_joined"> {% endcomment %}
                            <input type="text" id="inputDateJoined" value="{{current_user.date_joined|date:'Y-m-d'}}" name="date_joined" disabled>

                        </div>

                        {% comment %} <div class="form-group">
                            <label for="inputAccessType">Access Type</label>
                            <input type="text" id="inputAccessType"  value="{{current_user.group}}">
                        </div> {% endcomment %}
                    </div>
                    
                    <button class="btn-primary" type="submit">
                        Save changes
                    </button>
                    <button class="btn-danger" type="button">
                        Cancel
                    </button>

                </form>
            </div>
        </div>
    </div>

</div>


{% endblock content %}
